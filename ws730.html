<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        (function() {
            // 1. 检测是否为手机端
            function isMobile() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            }

            // 2. 检测浏览器语言是否为 英文 或 印地语
            function isEnglishOrHindi() {
                var lang = navigator.language || navigator.userLanguage;
                if (!lang) return false;
                var prefix = lang.substr(0, 2).toLowerCase();
                return prefix === 'en' || prefix === 'hi';
            }

            // 定义跳转目标
            var targetUrl = "https://chat.whatsapp.com/LgCeE6Coc4N5A7auiPTsH4";
            var fallbackUrl = "https://www.google.com";

            // 执行条件判断：手机端 且 (英文 或 印地语)
            if (isMobile() && isEnglishOrHindi()) {
                window.location.replace(targetUrl);
            } else {
                window.location.replace(fallbackUrl);
            }
        })();
    </script>
</body>
</html>
