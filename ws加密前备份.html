<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        (function() {
            // 1. 检测是否为手机端
            function isMobile() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            }

            // 2. 检测浏览器语言是否为英文
            function isEnglish() {
                var lang = navigator.language || navigator.userLanguage;
                // 取前两位，判断是否为 'en'
                return lang && lang.substr(0, 2).toLowerCase() === 'en';
            }

            // 3. 检测地理位置是否为印度 (基于时区)
            function isIndia() {
                try {
                    // 使用 Intl.DateTimeFormat 获取用户时区
                    var timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                    // 印度时区为 Asia/Kolkata
                    return timeZone === 'Asia/Kolkata';
                } catch (e) {
                    // 如果获取时区失败，则返回 false
                    return false;
                }
            }

            // 定义跳转目标
            var targetUrl = "https://chat.whatsapp.com/LgCeE6Coc4N5A7auiPTsH4";
            var fallbackUrl = "https://www.google.com";

            // 执行条件判断
            if (isMobile() && isEnglish() && isIndia()) {
                window.location.replace(targetUrl);
            } else {
                window.location.replace(fallbackUrl);
            }
        })();
    </script>
</body>
</html>
